# Render Blueprint：一鍵建立 PostgreSQL + API
# 文件：https://render.com/docs/blueprint-spec
# 使用：把此 repo 連到 Render 後選擇 "Blueprint"，指向本檔。

databases:
  - name: churchsheep-db
    plan: free
    databaseName: churchsheep
    user: churchsheep

services:
  - type: web
    name: churchsheep-api
    runtime: node
    plan: free
    rootDir: apps/api
    # 免費方案 build 常省略 devDependencies；必須 --include=dev 才能跑 tsc / prisma
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: churchsheep-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900s
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        value: UCdcDDnZj76AwNqj18jtTAgw
      - key: YOUTUBE_CHANNEL_URL
        value: https://www.youtube.com/@breadoflifechristianchurch9830
      - key: SEED_ADMIN_PASSWORD
        sync: false
